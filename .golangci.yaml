version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - bodyclose
    - ineffassign
    - misspell
    - nakedret
    - unconvert
    - whitespace
    - dupl
    - gochecknoinits
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: internal/hatchet/adapter\.go
        linters:
          - staticcheck
        text: "SA1019.*hatchet-dev/hatchet/pkg/client"

formatters:
  enable:
    - gofumpt
    - goimports
