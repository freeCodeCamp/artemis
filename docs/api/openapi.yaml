            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - occurredAt
                  - actor
                  - action
                  - outcome
                  properties:
                    id:
                      type: integer
                      description: Go int64 -> JSON number; always present, no omitempty
                    occurredAt:
                      type: string
                      format: date-time
                      description: Go time.Time -> RFC3339; always present
                    actor:
                      type: string
                      description: always present, may be empty string
                    action:
                      type: string
                      description: always present, may be empty string
                    site:
                      type: string
                      description: 'omitempty: absent when empty'
                    deployId:
                      type: string
                      description: 'omitempty: absent when empty'
                    outcome:
                      type: string
                      description: always present, may be empty string
                    requestId:
                      type: string
                      description: 'omitempty: absent when empty'
                    detail:
                      type: object
                      additionalProperties: true
                      description: 'Go map[string]any, omitempty: absent when nil/empty'
                description: AuditRow,. Built with make([]AuditRow,0,n) at so an empty
                  result serialises as [] and never null.
        '400':
          description: |-
            `invalid_since`: ?since= is not RFC3339
            `invalid_limit`: ?limit= is non-numeric or negative
            `invalid_offset`: ?offset= is non-numeric or negative
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: |-
            `missing_bearer`: Authorization header absent or not exactly "Bearer <token>" with no whitespace in the token
            `unauthenticated`: GH.ValidateToken rejected the token
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: "`user_unauthorized`: caller is not on AuditReadAuthzTeam in
            the Universe org"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: |-
            `rate_limited`: the GitHub team probe hit a rate limit
            `rate_limited`: GH.ValidateToken was rate limited
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: "`client_closed_request`: the store read failed with a context.Canceled
            cause and nothing was written yet. Non-standard status; when the request
            context is already done no body is written at all."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: |-
            `misconfigured`: h.AuditReadAuthzTeam == "" or h.RepoGH == nil — the gate fails closed
            `internal_error`: handler panic, from the Recoverer middleware
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: '`audit_read_failed`: h.Audit.ListAudit returned a non-cancel
            error; message is the opaque "upstream call failed"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: |-
            `audit_unavailable`: h.Audit == nil, i.e. the PG-less deploy-only wiring
            `upstream_unavailable`: the GitHub team probe failed for a non-rate-limit reason
            `upstream_unavailable`: GH.ValidateToken saw GitHub 5xx
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '504':
          description: the 60s chi middleware.Timeout deadline elapsed. chi writes
            a bare WriteHeader(504) with NO body and NO error envelope (go-chi/chi/v5
            middleware/timeout.go).
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
      tags:
      - audit
      x-feature-gate: 'none — mounted unconditionally inside the RequireGitHubBearer
        group. Runtime dependency instead of a mount gate: h.Audit nil yields 503
        audit_unavailable. Team gate: h.AuditReadAuthzTeam, env AUDIT_READ_AUTHZ_TEAM,
        default "staff", probed in the Universe org via h.RepoGH.'
      parameters:
      - name: site
        in: query
        required: false
        schema:
          type: string
        description: exact-match filter, passed through to pg.AuditFilter.Site. No
          validation.
      - name: actor
        in: query
        required: false
        schema:
          type: string
        description: exact-match filter. No validation.
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: exact-match filter. No validation.
      - name: since
        in: query
        required: false
        schema:
          type: string
        description: RFC3339 timestamp, parsed with time.Parse(time.RFC3339). Unparseable
          -> 400 invalid_since. Empty/absent -> zero time, no lower bound.
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: 'strconv.Atoi; must be >= 0 else 400 invalid_limit. 0 or absent
          is clamped downstream to 100; values above 500 are clamped to 500. Type:
          integer'
      - name: offset
        in: query
        required: false
        schema:
          type: string
        description: 'strconv.Atoi; must be >= 0 else 400 invalid_offset. Type: integer'
