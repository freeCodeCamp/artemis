          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub is unavailable for the token check, with the message
            "github api unavailable; retry later". The team check gives the same code with the message
            "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for GitHub bearer routes. The response
            has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: site
        in: path
        required: true
        schema:
          type: string
      - name: mode
        in: path
        required: true
        schema:
          type: string
          enum:
          - production
          - preview
  /api/site/{site}/promote:
    post:
      operationId: postSitePromote
      security:
      - githubBearer: []
      responses:
        '200':
          description: The production alias now points at the promoted deploy. The body carries the production
