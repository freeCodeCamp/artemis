            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '504':
          description: 60s chi middleware.Timeout elapsed; no body
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
      tags:
      - repo
      x-feature-gate: 'h.RepoEnabled. Team gate: h.RepoApproveAuthzTeam, env REPO_APPROVE_AUTHZ_TEAM,
