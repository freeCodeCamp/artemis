            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: |-
            `rate_limited`: the GitHub team probe hit a rate limit
            `rate_limited`: GH.ValidateToken rate limited
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: "`client_closed_request`: any of the four store calls failed
            with context.Canceled. Note CreateRepo and the durable MarkActive/MarkFailed
            run on context.WithoutCancel so a client disconnect cannot strand the
            row."
          headers:
            X-Request-ID:
