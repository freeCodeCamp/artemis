            Message "deployId is not a valid artemis deploy id". The service checks the site and the team
            membership before this check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent, or it is not "Bearer <token>"
            with no whitespace in the token. Message "missing or malformed Authorization header".

            `unauthenticated`: GitHub rejected the token. Message "invalid github token", or "could not
            validate github token" when the check fails for another reason.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: the site is not registered, or it has no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: the caller is not a member of an authorized team of the site. Message
            "user is not on any authorized team for this site".

            The service checks the site before it checks the team membership.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`deploy_aliased`: the production alias or the preview alias points at this deploy.
            Message "deploy is the target of a live alias; promote or roll back before deleting". Next
            to `error`, the body carries `site`, `deployId`, and `alias`. `alias` gives "production" when
            both aliases point at the deploy, because the service reads production first. The deploy keeps
            its objects.

            `site_reserved`: a delete put the site name in a reservation period. Message "site name is
            reserved after a delete; undelete it or wait for the reclaim". The error object also carries
            `reservedUntil`, an RFC 3339 time in UTC. Nothing moves.

            `site_locked`: a different operation has exclusive access to the site. Message "another operation
            on this site is in progress; retry shortly". Send the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: '`site_gone`: the site is not registered any more. Message "site was deleted; its
            deploys cannot be tombstoned". The service makes this check immediately before it reads the
            aliases. No tombstone is recorded, and no object moves.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applied a rate limit to the token check or to the team
            check. Message "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: a storage call or a database call reported a canceled
            operation. Message "request canceled by client". A client disconnect alone does not give this
            status, because the delete continues to its end. When the request is already canceled, the
            service sends no body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
        '500':
          description: '`internal_error`: the request failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`r2_get_failed`: the read of the production alias or the preview alias failed
            for a cause other than a missing alias. Message "upstream call failed". Nothing moves.

            `tombstone_record_failed`: the service could not record the tombstone. Message "upstream call
            failed". The deploy keeps its objects, therefore you can send the request again.

            `r2_move_failed`: the move of the deploy objects to the trash area failed. Message "upstream
            call failed". The tombstone is already recorded. Some of the objects can be in the trash area.

            `registry_read_failed`: the read of the site record failed. Message "upstream call failed".

            `site_lock_failed`: the service could not get exclusive access to the site, for a cause other
            than contention. Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`unavailable`: the service cannot record tombstones. Message "tombstone store
            not configured". Nothing moves.

