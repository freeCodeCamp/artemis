  /api/site/{site}/deploys/{deployId}:
    delete:
      operationId: deleteSiteDeploys
      security:
      - githubBearer: []
      responses:
        '200':
          description: The service recorded a tombstone for the deploy, then moved its stored objects
            to the trash area. The body carries `site`, `deployId`, `status` with the value "tombstoned",
            and `moved`. The trash listing then shows the deploy, and the restore operation can bring
