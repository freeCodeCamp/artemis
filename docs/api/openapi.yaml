---
openapi: 3.0.3
info:
  title: artemis deploy proxy
  version: '1'
  description: Static-apps deploy proxy for the freeCodeCamp Universe platform. This
    document is the authoritative API surface (ADR-016, amendment 2026-09-03). Every
    routed response carries X-Request-ID and X-Artemis-Version.
servers:
- url: https://uploads.freecode.camp
paths:
  "/healthz":
    get:
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: always; no auth, no upstream calls, no branches
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '500':
          description: "`internal_error`: any panic in the chain, converted by Recoverer.
            No code path in HealthZ itself can panic."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      tags:
      - public
  "/readyz":
    get:
      operationId: getReadyz
      security: []
      responses:
        '200':
          description: |-
            Valkey ping OK and both R2 and Postgres pings OK (or their deps are nil);. `degraded` key is ABSENT, not false.
            Valkey ping OK but R2 ping and/or Postgres ping failed;. One body regardless of how many degradable upstreams are down.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - ready
                additionalProperties: false
                properties:
                  ready:
                    type: boolean
                    enum:
                    - true
        '500':
          description: "`internal_error`: any panic, converted by Recoverer"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: '`valkey_unreachable`: h.Health.Ping fails. message is the
            literal "upstream call failed". Valkey failure short-circuits before the
            degraded branch, so it wins over a simultaneous R2/PG failure.'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      tags:
      - public
  "/api/whoami":
    get:
      operationId: getWhoami
      security:
      - githubBearer: []
      responses:
        '200':
          description: token valid and GH.UserTeams succeeded;
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - login
                - authorizedSites
                additionalProperties: false
                properties:
                  login:
                    type: string
                    description: GitHub login resolved by RequireGitHubBearer
                  authorizedSites:
                    type: array
                    items:
                      type: string
                    description: sitekey.Slug is `type Slug string` with no custom
                      JSON marshaller, so plain strings. Sorted ascending. Initialised
                      to an empty slice so it serialises as [] and never null.
        '401':
          description: |-
            `missing_bearer`: no Authorization header, or not exactly `Bearer <token>` with no internal whitespace
            `unauthenticated`: GH ValidateToken failed. Two messages, one code: "invalid github token" on a GitHub 401/403, "could not validate github token" on anything else
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: '`rate_limited`: GitHub rate limit. From the middleware, message
            "github api rate limited; retry later"; from the in-handler UserTeams
            probe via writeGitHubProbeError, the same code and message'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: "`internal_error`: any panic, converted by Recoverer"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: '`upstream_unavailable`: middleware: GitHub 5xx, message "github
            api unavailable; retry later". Handler: any non-rate-limit UserTeams error,
            message "could not probe team membership"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '504':
          description: request exceeds the 60s apiRequestTimeout on the bearer group;
            chi middleware.Timeout writes a bare 504 with no body
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
      tags:
      - whoami
  "/api/deploy/init":
    post:
      operationId: postDeployInit
      security:
      - githubBearer: []
      responses:
        '200':
          description: site registered, caller on an authorized team, JWT signed
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - deployId
                - jwt
                - expiresAt
                additionalProperties: false
                properties:
                  deployId:
                    type: string
                    description: minted by h.NewDeployID(sha); production form <ts>-<sha7>,
                      e.g. 20260420-141522-abc1234
                  jwt:
                    type: string
                    description: deploy-session HS256 JWT scoped to (login, site,
                      deployId);
                  expiresAt:
                    type: string
                    description: UTC, formatted with the literal layout "2006-01-02T15:04:05Z"
                      -- second precision, always a trailing Z
                description: DeployInitResponse,; written at
        '400':
          description: '`bad_request`: three distinct causes, one code. (a) body is
            not valid JSON -> message "invalid json body". (b) site or sha empty ->
            "site and sha are required". (c) sha fails the charset/length pattern
            -> "sha must match [A-Za-z0-9-]{1,64}"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: |-
            `missing_bearer`: missing/malformed Authorization header
            `unauthenticated`: GitHub token invalid or unvalidatable
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: |-
            `site_unauthorized`: the registry snapshot has no teams for the slug and the site is not merely reserved -- unregistered or teamless. message "site is not registered or has no authorized teams"
            `user_unauthorized`: AuthorizeForSite returned false -- caller is on none of the site's teams; message "user is not on any authorized team for this site"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: "`site_reserved`: the slug is held by a post-delete reservation.
            Extra key `reservedUntil` = RFC3339 UTC"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: '`too_large`: request body exceeds 8 MiB; message "request
            body too large"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: "`rate_limited`: AuthorizeForSite hit the GitHub rate limit.
            Also emitted earlier by the bearer middleware"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: '`client_closed_request`: the registry read failed with context.Canceled.
            If the request context is not yet done the envelope is written with message
            "request canceled by client"; if it is done, nothing is written and only
            the access log records 499'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
        '500':
          description: |-
            `jwt_sign_failed`: h.JWT.Sign returned an error; message "could not sign deploy-session jwt"
            `internal_error`: any panic, converted by Recoverer
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: '`registry_read_failed`: the authoritative registry read behind
            the snapshot miss failed for any reason other than ErrReserved/ErrNotFound;
            message "upstream call failed"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: '`upstream_unavailable`: AuthorizeForSite failed for any other
            reason, message "could not probe team membership". Also emitted by the
            middleware on a GitHub 5xx with a different message'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '504':
          description: 60s apiRequestTimeout exceeded; bare 504, no body
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
      tags:
      - deploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - site
              - sha
              additionalProperties: true
              properties:
                site:
                  type: string
                  description: 'sitekey.Slug (plain string). Required: rejected when
                    empty.'
                sha:
                  type: string
                  pattern: "^[A-Za-z0-9-]{1,64}$"
                  description: Required and non-empty; must match shaPattern.
                files:
                  type: array
                  items:
                    type: string
                  description: Optional (`json:"files,omitempty"`). DECODED BUT NEVER
                    READ by DeployInit -- no reference to req.Files anywhere in. The
                    struct comment calls it the manifest used by /finalize, but finalize
                    reads its own body.
              description: DeployInitRequest,. Decoded with decodeJSON at 8 MiB. Unknown
                fields are ignored.
  "/api/deploy/{deployId}/upload":
    put:
      operationId: putDeployUpload
      security:
      - deployJWT: []
      responses:
        '200':
          description: bytes stored in R2
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - received
                - key
                additionalProperties: false
                properties:
                  received:
                    type: string
                    description: the ?path= value, echoed verbatim
                  key:
                    type: string
                    description: 'the full R2 object key: deploy prefix + path, e.g.
                      www/deploys/20260420-141522-abc1234/index.html'
                description: written at as an inline map, not a named struct
        '400':
          description: '`bad_request`: two causes, one code: missing/empty ?path=
            -> "missing ?path="; unclean path -> "path must be relative and not traverse"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: |-
            `missing_bearer`: missing/malformed Authorization header
            `jwt_expired`: the deploy-session JWT is past exp; message "deploy-session jwt expired"
            `missing_jwt`: claims absent from the request context; message "deploy-session jwt missing". Defensive -- unreachable behind RequireDeployJWT on the mounted route.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: |-
            `jwt_invalid`: any other JWT parse/verify failure -- bad signature, wrong alg, malformed; message "invalid deploy-session jwt"
            `site_unauthorized`: the JWT verifies but its `site` claim has no teams in the registry snapshot and is not reserved
            `jwt_wrong_deploy`: the {deployId} URL param differs from the JWT's deployId claim; message "deploy-session jwt does not match url deploy id"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: |-
            `site_reserved`: the JWT's site claim is held by a post-delete reservation AND the snapshot already dropped it. A stale snapshot that still lists teams lets the upload through with 200 -- an upload is not fenced per file.
            `deploy_finalized`: the deploy is already fenced as finalized; message "deploy is finalized and immutable; start a new deploy"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: '`too_large`: body exceeds h.UploadMaxBytes (only enforced
            when > 0); message "upload body exceeds configured limit"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: "`client_closed_request`: the fence read or the R2 put failed
            with context.Canceled -- the nominal 503/502 is replaced by 499 and no
            Sentry event is raised"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: "`internal_error`: any panic, converted by Recoverer"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: |-
            `registry_read_failed`: the registry read inside denyUnregisteredSite failed
            `r2_put_failed`: R2 PutObject failed for a non-size reason; op tag r2.put.upload; message "upstream call failed"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: '`fence_unavailable`: h.DeployFence.IsDeployFinalized failed
            (Valkey read fault). Fails closed. message "upstream call failed"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '504':
          description: 10-minute uploadRequestTimeout exceeded on the JWT group; bare
            504, no body
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
      tags:
      - deploy
      parameters:
      - name: deployId
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: 'Destination path relative to the deploy prefix; the R2 key is
          deployPrefix + path. Missing/empty -> 400 bad_request "missing ?path=".
          Must pass isCleanRelPath: rejects "", ".", any leading "/", ".." traversal,
          bytes < 0x20, 0x7F, backslash, and anything path.Clean would rewrite. High-bit
          UTF-8 is accepted.'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: 'Raw opaque bytes -- NOT JSON. The body is streamed straight
                into R2. Request headers that matter: `Content-Type` is optional --
                if absent, the server falls back to mime.TypeByExtension(ext of ?path=),
                then to "application/octet-stream"; the resolved value is stored as
                the R2 object''s content type. `Content-Length` is optional -- when
                >= 0 it is propagated to the R2 SDK to avoid chunked transfer-encoding,
                a negative value becomes 0/unknown. Body size is capped by http.MaxBytesReader
                only when h.UploadMaxBytes > 0.'
  "/api/deploy/{deployId}/finalize":
    post:
      operationId: postDeployFinalize
      security:
      - deployJWT: []
      responses:
        '200':
          description: manifest verified, marker written, alias flipped, index committed.
            The response is written before the edge purge; flushThenPurge only flushes
            the ResponseWriter and then purges -- it writes no bytes and no headers.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - deployId
                - mode
                additionalProperties: false
                properties:
                  url:
                    type: string
                    description: public URL, rendered from config by substituting
                      <site> into PublicProductionURLFmt or PublicPreviewURLFmt --
                      not a constant baked into the binary
                  deployId:
                    type: string
                    description: the {deployId} URL param, which the JWT already pinned
                  mode:
                    type: string
                    enum:
                    - preview
                    - production
                    description: the NORMALISED mode, so an omitted request mode comes
                      back as "preview"
                description: written at as an inline map, not a named struct
        '400':
          description: |-
            `bad_request`: two causes, one code: body is not valid JSON -> "invalid json body"; mode is neither ""/preview nor production -> the message is the literal `mode must be "preview" or "production"`
            `manifest_required`: files is absent or empty; message "files manifest is required and must list at least one path"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: |-
            `missing_bearer`: missing/malformed Authorization header
            `jwt_expired`: deploy-session JWT past exp
            `missing_jwt`: claims absent from context. Defensive; unreachable on the mounted route.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: |-
            `jwt_invalid`: any other JWT verify failure
            `site_unauthorized`: the JWT's site claim has no teams in the snapshot and is not reserved
            `jwt_wrong_deploy`: {deployId} URL param != the JWT deployId claim
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: |-
            `site_reserved`: under the site lock, the authoritative registry read shows the site reserved after a delete; message "site name is reserved after a delete; undelete it or wait for the reclaim". No alias is written.
            `site_locked`: the advisory site lock timed out; message "another operation on this site is in progress; retry shortly"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '410':
          description: '`site_gone`: under the site lock, the site is absent from
            the registry (registry.ErrNotFound); message "site was deleted; deploy
            cannot be finalized". Beats a stale snapshot that still lists the site.'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '413':
          description: '`too_large`: body exceeds 8 MiB; message "request body too
            large"'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: |-
            `missing_index`: files has no root "index.html"; message "deploy has no root index.html; the site cannot be served at /". The `hint` extra is present ONLY when looksLikeFrameworkBuild matches; its text is the static-export guidance at. No R2 marker is written on this path.
            `verify_failed`: R2 ListObjectsV2 shows a listed file absent under the deploy prefix; message "deploy is missing expected files", `missing` = r2.VerifyError.Missing. NOTE: written by a raw writeJSON, not writeError -- the envelope shape is identical but errCode is NOT stashed on the statusWriter, so the access log carries no errCode for this response. The alias is not written.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: "`client_closed_request`: any of the above upstream failures
            (verify list, registry read, marker put, alias put, pg index, site lock)
            carried context.Canceled -- the nominal status is replaced by 499"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: "`internal_error`: any panic, converted by Recoverer"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: |-
            `registry_read_failed`: the under-lock registry read failed for any other reason; op registry.get.finalize
            `r2_put_failed`: two ops, one code: the _artemis_meta.json marker put failed or the alias put failed. message "upstream call failed" both times.
            `pg_write_failed`: the Postgres deploy-index commit failed after 3 attempts with 150ms doubling backoff. The alias is already live at this point -- a partial commit, audited as stage=index.
            `site_lock_failed`: the site lock failed for any non-timeout reason; op pg.lock.site
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '504':
          description: 10-minute uploadRequestTimeout exceeded; bare 504, no body
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
      tags:
      - deploy
      parameters:
      - name: deployId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - files
              additionalProperties: true
              properties:
                mode:
                  type: string
                  enum:
                  - preview
                  - production
                  description: OPTIONAL despite having no omitempty tag. normalizeMode
                    lowercases and trims; "" and "preview" both normalise to "preview",
                    "production" to "production", anything else is a 400. The normalised
                    value is what appears in the response and in the R2 marker.
                  default: preview
                files:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: REQUIRED and non-empty despite the `json:"files,omitempty"`
                    tag -- an empty or absent list is a 400 manifest_required. Paths
                    are relative to the deploy prefix. The list MUST contain the exact
                    literal "index.html" at the root; a nested index.html does not
                    satisfy it. Every listed path must already exist under the deploy
                    prefix in R2.
              description: DeployFinalizeRequest,. Decoded with decodeJSON at 8 MiB.
                Unknown fields ignored.
