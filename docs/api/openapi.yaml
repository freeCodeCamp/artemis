openapi: 3.0.3
info:
  title: artemis deploy proxy
  version: '1'
  description: Static-apps deploy proxy for the freeCodeCamp Universe platform. This document is the authoritative
    API surface (ADR-016, amendment 2026-09-03). Every routed response carries X-Request-ID and X-Artemis-Version.
    A JSON error body has the shape `{"error":{"code":"...","message":"..."}}`, and some codes add more
    fields. A request that the caller cancels can end with status 499 and code `client_closed_request`.
    Message "request canceled by client".
servers:
- url: https://uploads.freecode.camp
paths:
  /healthz:
    get:
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: The route always answers 200. It needs no credentials and calls no other service.
            The body is `{"ok":true}`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                    enum:
                    - true
        '500':
          description: '`internal_error`: an unexpected server fault stops the request. The message is
            "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - public
  /readyz:
    get:
      operationId: getReadyz
      security: []
      responses:
        '200':
          description: 'The body is `{"ready": true}` when the Valkey, R2 and Postgres probes all answer.
            The `degraded` field is absent, not false. A probe that does not answer inside its time limit
            counts as a failure.

            The body is `{"ready": true, "degraded": true}` when Valkey answers and the R2 probe, the
            Postgres probe, or both fail. The body carries one `degraded` field, whatever number of these
            two probes fail.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - ready
                additionalProperties: false
                properties:
                  ready:
                    type: boolean
                    enum:
                    - true
                  degraded:
                    type: boolean
                    enum:
                    - true
        '500':
          description: '`internal_error`: an unexpected server fault stops the request. The message is
            "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`valkey_unreachable`: the Valkey probe fails. The message is "upstream call failed".
            This answer wins over a failure of the R2 probe or the Postgres probe at the same time.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - public
  /api/whoami:
    get:
      operationId: getWhoami
      security:
      - githubBearer: []
      responses:
        '200':
          description: The bearer token is valid and the team lookup succeeded. The body gives the caller
            login and the sites the caller can deploy to.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - login
                - authorizedSites
                additionalProperties: false
                properties:
                  login:
                    type: string
                    description: The GitHub login that the service resolved from the bearer token.
                  authorizedSites:
                    type: array
                    items:
                      type: string
                    description: Slugs of the registered sites that the caller can deploy to, in ascending
                      order. A site is listed when the caller is a member of at least one team of that
                      site. A site with no teams is never in this list. The value is an empty array when
                      no site matches, and never null.
        '401':
          description: '`missing_bearer`: the `Authorization` header is absent, or it is not `Bearer <token>`.
            The token must not be empty. The token must not contain a space, tab, carriage return, or
            line feed. Message "missing or malformed Authorization header".

            `unauthenticated`: GitHub refused the token. Message "invalid github token" when GitHub answers
            401, 403, or 404 without a rate limit. Message "could not validate github token" for any other
            failure of the token check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applied a rate limit to the token check or to the team
            lookup. Message "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`internal_error`: an unexpected fault ended the request. Message "internal server
            error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub answered the token check with a 5xx status. Message
            "github api unavailable; retry later". The same code applies when the team lookup fails for
            a reason other than a rate limit. That failure gives the message "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request went past the 60 second limit for this route. The response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - whoami
  /api/deploy/init:
    post:
      operationId: postDeployInit
      security:
      - githubBearer: []
      responses:
        '200':
          description: The service started a deploy session. The body carries `deployId`, `jwt`, and `expiresAt`.
            Use the `jwt` on the upload and finalize calls.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - deployId
                - jwt
                - expiresAt
                additionalProperties: false
                properties:
                  deployId:
                    type: string
                    description: Identifier of the new deploy. The form is `<yyyymmdd>-<hhmmss>-<sha7>`
                      in UTC, for example `20260420-141522-abc1234`. The last part is the first 7 characters
                      of `sha`, or all of `sha` when it is shorter.
                  jwt:
                    type: string
                    description: 'Deploy-session token for the caller, the site, and this `deployId`.
                      Send it as `Authorization: Bearer <jwt>` on the upload and finalize calls.'
                  expiresAt:
                    type: string
                    description: Expiry of `jwt` in UTC, with second precision and a trailing `Z`, for
                      example `2026-04-20T14:30:22Z`. The upload and finalize calls refuse the token after
                      this time.
                description: The credentials for the new deploy session. The object always carries `deployId`,
                  `jwt`, and `expiresAt`.
        '400':
          description: '`bad_request`: three causes give this code. The body is not valid JSON. Message
            "invalid json body". The field `site` or `sha` is empty or absent. Message "site and sha are
            required". The field `sha` does not match `^[A-Za-z0-9-]{1,64}$`. Message "sha must match
            [A-Za-z0-9-]{1,64}".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent, is not `Bearer <token>`,
            or the token holds whitespace. Message "missing or malformed Authorization header".

            `unauthenticated`: GitHub refuses the token. Message "invalid github token". If the token
            check fails for another reason, the message is "could not validate github token".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: the site is not registered, or it lists no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: the caller is on no authorized team for the site. Message "user is not
            on any authorized team for this site". The service makes this check after the site check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_reserved`: a delete holds the site name, so the site accepts no deploy.
            Message "site name is reserved after a delete; undelete it or wait for the reclaim". The error
            object also carries `reservedUntil`, an RFC 3339 time in UTC.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`: the request body is more than 8 MiB. Message "request body too large".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub rate-limits the token check or the team check. Message
            "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`jwt_sign_failed`: the service could not sign the deploy-session token. Message
            "could not sign deploy-session jwt".

            `internal_error`: the service stopped with an unexpected fault. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub answered the token check with a server error. Message
            "github api unavailable; retry later". The team check gives the same code for a failure that
            is not a rate limit. Message "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran more than 60 seconds. The response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - deploy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - site
              - sha
              additionalProperties: true
              properties:
                site:
                  type: string
                  description: Slug of the registered site to deploy. The field is required and must not
                    be empty.
                sha:
                  type: string
                  pattern: ^[A-Za-z0-9-]{1,64}$
                  description: Commit identifier for this deploy. The field is required and must match
                    `^[A-Za-z0-9-]{1,64}$`. Its first 7 characters go into `deployId`, or all of it when
                    it is shorter.
                files:
                  type: array
                  items:
                    type: string
                  description: Optional list of file paths. This call accepts the field but makes no use
                    of it. Send the manifest to the finalize call, which requires its own `files` list.
              description: The body that starts a deploy session. The service reads at most 8 MiB and
                ignores unknown fields.
  /api/deploy/{deployId}/upload:
    put:
      operationId: putDeployUpload
      security:
      - deployJWT: []
      responses:
        '200':
          description: The service stored the bytes under the deploy prefix. The body reports the path
            it received and the object key.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - received
                - key
                additionalProperties: false
                properties:
                  received:
                    type: string
                    description: This field repeats the value of the `path` query parameter without a
                      change.
                  key:
                    type: string
                    description: This field gives the full object key. The key is the deploy prefix plus
                      the `path` value, for example `www/deploys/20260420-141522-abc1234/index.html`.
                description: The body confirms one stored object. It carries only the `received` and `key`
                  fields.
        '400':
          description: '`bad_request`: the `path` query parameter is absent or empty. Message "missing
            ?path=". The same code applies when the `path` value is not a clean relative path. That cause
            gives the message "path must be relative and not traverse". The service checks for the value
            before it checks the shape.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the `Authorization` header is absent, or it is not `Bearer <token>`.
            The token must not be empty. The token must not contain a space, tab, carriage return, or
            line feed. Message "missing or malformed Authorization header".

            `jwt_expired`: the deploy-session token is past its expiry. Message "deploy-session jwt expired".

            `missing_jwt`: the service finds no deploy-session claims on the request. Message "deploy-session
            jwt missing".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`jwt_invalid`: the service could not verify the deploy-session token. A bad signature,
            a wrong algorithm, or a malformed token gives this code. Message "invalid deploy-session jwt".

            `site_unauthorized`: the site in the token is not registered, or it has no authorized team.
            The same code applies when the service cannot read the site record. Message "site is not registered
            or has no authorized teams".

            `jwt_wrong_deploy`: the `deployId` path parameter differs from the deploy id in the token.
            Message "deploy-session jwt does not match url deploy id". The service checks the token first,
            then the site, then the deploy id.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_reserved`: a delete holds the site name of the token as reserved. Message
            "site name is reserved after a delete; undelete it or wait for the reclaim". The body also
            carries `reservedUntil`, the end of the reservation in RFC 3339 form. The service reads a
            cached team list. A very recent delete can therefore still let an upload answer 200.

            `deploy_finalized`: the deploy is finalized and accepts no more files. Message "deploy is
            finalized and immutable; start a new deploy".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`: the request body is larger than the upload limit. Message "upload
            body exceeds configured limit". The default limit is 100 MiB. The service stores no object
            for a refused body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the client canceled the request before the service answered.
            Message "request canceled by client". The service sends no body when the connection is already
            closed.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`internal_error`: the service stopped with an unexpected fault. Message "internal
            server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`r2_put_failed`: the write to R2 failed for a reason other than the size limit.
            Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`fence_unavailable`: the service could not read the finalized state of the deploy.
            Message "upstream call failed". The service refuses the upload, because a finalized deploy
            must not change.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The service did not answer in 10 minutes. The response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - deploy
      parameters:
      - name: deployId
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Destination path of the file, relative to the deploy prefix. The object key is the
          deploy prefix plus this value. The parameter is mandatory. An absent or empty value gives 400
          `bad_request` with the message "missing ?path=". The value must be a clean relative path. The
          service refuses ".", "..", a leading "/", a ".." segment, a backslash, a byte below 0x20, and
          byte 0x7F. The service also refuses a value that is not in its shortest form, such as "a//b",
          "./a", or "a/". A refused value gives 400 `bad_request` with the message "path must be relative
          and not traverse". Characters outside ASCII are accepted, for example "café/menu.html".
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The raw bytes of one file. The service does not read the body as JSON. The
                service writes the body to R2 without a change. Send `Content-Type` for the file. When
                that header is absent, the service derives the type from the extension of the `path` value.
                When no type matches the extension, the service stores "application/octet-stream". Send
                `Content-Length` when you know the size. The service gives the length to R2 and prevents
                chunked transfer encoding. A body larger than the upload limit gives 413. The default
                limit is 100 MiB.
  /api/deploy/{deployId}/finalize:
    post:
      operationId: postDeployFinalize
      security:
      - deployJWT: []
      responses:
        '200':
          description: The service checked every listed file, then moved the alias to this deploy. The
            site now serves this deploy in the given mode. The service sends this body before it clears
            the edge cache; the purge adds no headers and no data.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - deployId
                - mode
                additionalProperties: false
                properties:
                  url:
                    type: string
                    description: The public URL that serves this deploy. Preview mode and production mode
                      use different hostnames, which come from the service configuration.
                  deployId:
                    type: string
                    description: The deploy id from the URL path. It is always equal to the deploy id
                      in the deploy-session token.
                  mode:
                    type: string
                    enum:
                    - preview
                    - production
                    description: The mode after normalization. A request that omits `mode` gets "preview"
                      here.
                description: The result of the finalize. It gives the public URL, the deploy id, and the
                  applied mode.
        '400':
          description: '`bad_request`: the body is not valid JSON. Message "invalid json body". The same
            code applies when `mode` is not "", "preview", or "production". Message `mode must be "preview"
            or "production"`.

            `manifest_required`: `files` is absent or empty, and the service examines `mode` first. Message
            "files manifest is required and must list at least one path".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the `Authorization` header is absent or malformed. Message "missing
            or malformed Authorization header".

            `jwt_expired`: the deploy-session token is past its expiry time. Message "deploy-session jwt
            expired".

            `missing_jwt`: the request carries no deploy-session claims. Message "deploy-session jwt missing".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`jwt_invalid`: the deploy-session token does not verify. Message "invalid deploy-session
            jwt".

            `site_unauthorized`: the site in the token has no authorized teams. Message "site is not registered
            or has no authorized teams".

            `jwt_wrong_deploy`: the `deployId` path parameter is different from the deploy id in the token.
            Message "deploy-session jwt does not match url deploy id".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_reserved`: the site name is held after a delete. Message "site name is reserved
            after a delete; undelete it or wait for the reclaim". The error object also carries `reservedUntil`,
            an RFC 3339 time. No alias is written.

            `site_locked`: a different operation has exclusive access to the site. Message "another operation
            on this site is in progress; retry shortly". Send the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: '`site_gone`: the site is no longer registered. Message "site was deleted; deploy
            cannot be finalized". The service makes this check immediately before the alias write. Therefore
            a deleted site cannot get a live alias again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`: the request body is more than 8 MiB. Message "request body too large".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`missing_index`: `files` does not contain the exact path "index.html" at the top
            level. Message "deploy has no root index.html; the site cannot be served at /". A nested path
            such as "assets/index.html" does not satisfy this rule. The error object also carries `hint`
            when the list looks like a framework build directory. That match needs `BUILD_ID` together
            with `build-manifest.json`, or `nitro.json`, or a path below `_app/immutable/`, `.next/`,
            `.nuxt/`, `.svelte-kit/`, or `.output/`. The `hint` text is "This looks like a framework build
            directory, not a static export. Configure a static export (e.g. Next.js output: ''export'',
            Nuxt nuxi generate, SvelteKit adapter-static) and point platform.yaml build.output at the
            export directory (e.g. out/, dist/, build/)." No alias is written.

            `verify_failed`: one or more listed files are not present in this deploy. Message "deploy
            is missing expected files". The error object also carries `missing`, the list of the absent
            paths. No alias is written.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the client cancels the request while the service checks
            the listed files. Message "request canceled by client". A client that already closed the connection
            gets no body. A cancel after the file check passes does not stop the deploy. It goes live,
            and the deploy list gets the record.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`internal_error`: the service failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`r2_list_failed`: the storage listing that checks the uploaded files failed. Message
            "upstream call failed".

            `registry_read_failed`: the site record read before the alias write failed. Message "upstream
            call failed".

            `r2_put_failed`: a storage write failed, either the deploy metadata object or the alias. The
            previous alias stays live. Message "upstream call failed".

            `pg_write_failed`: the deploy-list write failed after 3 attempts. The new alias is already
            live, therefore the site serves this deploy but the deploy list can omit it. Message "upstream
            call failed".

            `site_lock_failed`: the service could not get exclusive access to the site, for a cause other
            than contention. Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 10 minute limit for the deploy-token routes. The
            body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - deploy
      parameters:
      - name: deployId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - files
              additionalProperties: true
              properties:
                mode:
                  type: string
                  enum:
                  - preview
                  - production
                  description: Optional. The service removes leading and trailing spaces, and makes the
                    value lowercase. An empty value or "preview" gives "preview", and "production" gives
                    "production". A different value gives 400 `bad_request`. The response carries the
                    normalized value.
                  default: preview
                files:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Required, with a minimum of one path. Each path must be equal to a `path`
                    query value that you uploaded for this deploy. The list must contain the exact path
                    "index.html" at the top level. A nested index.html does not satisfy this rule. An
                    absent or empty list gives 400 `manifest_required`. A path that the service cannot
                    find gives 422 `verify_failed`.
              description: The finalize request. The body limit is 8 MiB. The service ignores unknown
                fields.
  /api/audit:
    get:
      operationId: getAudit
      security:
      - githubBearer: []
      responses:
        '200':
          description: The team check passed and the audit log read succeeded. The body is a JSON array
            of audit entries.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - occurredAt
                  - actor
                  - action
                  - outcome
                  properties:
                    id:
                      type: integer
                      description: Number that identifies the audit entry. The field is always present.
                    occurredAt:
                      type: string
                      format: date-time
                      description: Time of the event, as an RFC3339 timestamp. The field is always present.
                    actor:
                      type: string
                      description: Login of the caller that caused the event. The field is always present.
                        The value can be an empty string.
                    action:
                      type: string
                      description: Name of the action, for example "site.promote" or "deploy.finalize".
                        The field is always present. The value can be an empty string.
                    site:
                      type: string
                      description: Site slug that the event applies to. The field is absent when the value
                        is empty.
                    deployId:
                      type: string
                      description: Deploy identifier that the event applies to. The field is absent when
                        the value is empty.
                    outcome:
                      type: string
                      description: Result of the action, for example "success". The field is always present.
                        The value can be an empty string.
                    requestId:
                      type: string
                      description: Identifier of the request that caused the event. The value matches
                        the X-Request-ID header on the response to that request. The field is absent when
                        the value is empty.
                    detail:
                      type: object
                      additionalProperties: true
                      description: Object with more data about the event. The keys change with the action.
                        The field is absent when there is no data.
                description: Array of audit entries. The service sorts the entries by time, newest first,
                  then by identifier, highest first. An empty result gives `[]` and never `null`.
        '400':
          description: '`invalid_since`: the `since` value is not an RFC3339 timestamp. Message "since
            must be an RFC3339 timestamp".

            `invalid_limit`: the `limit` value is not an integer, or it is negative. Message "limit must
            be a non-negative integer".

            `invalid_offset`: the `offset` value is not an integer, or it is negative. Message "offset
            must be a non-negative integer".

            The service checks the token and the team membership before the query parameters.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent, or it is not "Bearer <token>"
            with no whitespace in the token. Message "missing or malformed Authorization header".

            `unauthenticated`: GitHub rejected the token. Message "invalid github token", or "could not
            validate github token" when the check fails for another reason.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`user_unauthorized`: the caller is not a member of the audit-read team in the
            Universe organization. Message "caller is not on the required team".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applied a rate limit to the token check or to the team
            check. Message "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the client closed the connection during the audit log
            read. Message "request canceled by client". This status is not standard. When the request
            is already canceled, the service sends no body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`misconfigured`: the service has no audit-read team, or no GitHub client for the
            Universe organization. The team check then fails closed. Message "audit authz team not set"
            or "universe-org github client not configured".

            `internal_error`: the request failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`audit_read_failed`: the audit log read failed. The service does not give the
            cause. Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`audit_unavailable`: this service has no audit log store. Message "audit log is
            not configured".

            `upstream_unavailable`: GitHub is unavailable for the token check, with the message "github
            api unavailable; retry later". The team check gives the same code with the message "could
            not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for GitHub bearer routes. The response
            has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - audit
      x-feature-gate: The route has no feature gate, and it is always present. The caller must be a member
        of the audit-read team, by default "staff", in the Universe organization. When the service has
        no audit log store, the route answers 503 `audit_unavailable`.
      parameters:
      - name: site
        in: query
        required: false
        schema:
          type: string
        description: Filter on the site slug. The match must be exact. The service does not validate this
          value.
      - name: actor
        in: query
        required: false
        schema:
          type: string
        description: Filter on the actor login. The match must be exact. The service does not validate
          this value.
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: Filter on the action name. The match must be exact. The service does not validate
          this value.
      - name: since
        in: query
        required: false
        schema:
          type: string
        description: Lower bound on the event time. The value must be an RFC3339 timestamp. If the service
          cannot parse the value, it answers 400 `invalid_since`. An absent or empty value gives no lower
          bound.
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Maximum number of entries in the response. The value must be an integer of 0 or more,
          or the service answers 400 `invalid_limit`. An absent parameter, or the value 0, gives at most
          100 entries. The service reduces a value above 500 to 500.
      - name: offset
        in: query
        required: false
        schema:
          type: string
        description: Number of entries to skip before the response starts. The value must be an integer
          of 0 or more, or the service answers 400 `invalid_offset`.
  /api/repo:
    post:
      operationId: postRepo
      security:
      - githubBearer: []
      responses:
        '201':
          description: The service queued the request for approval. The body carries the new repo request
            record with the status "pending".
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - owner
                - visibility
                - status
                - requestedBy
                - createdAt
                - updatedAt
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  owner:
                    type: string
                    description: The GitHub organization that will own the repository. The service sets
                      this value. The default organization is "freeCodeCamp-Universe".
                  visibility:
                    type: string
                    enum:
                    - public
                    - private
                  description:
                    type: string
                    description: The description that the request carries. The field is absent when the
                      caller sent no description.
                  template:
                    type: string
                    description: The template repository name that the request carries. The field is absent
                      when the caller sent no template.
                  status:
                    type: string
                    enum:
                    - pending
                    - approved
                    - active
                    - rejected
                    - failed
                    description: The lifecycle state of the request. A newly queued request always has
                      the status "pending".
                  url:
                    type: string
                    description: The URL of the created repository. The field is present only when the
                      status is "active".
                  error:
                    type: string
                    description: The failure message from the repository creation. The field is present
                      only when the status is "failed".
                  requestedBy:
                    type: string
                    description: The GitHub login of the caller who sent the request. This response always
                      carries this field. The list, get, approve, and reject responses hide it from a
                      caller who cannot read the audit trail.
                  approver:
                    type: string
                    description: The GitHub login of the person who approved or rejected the request.
                      The field is absent while the status is "pending".
                  rejectReason:
                    type: string
                    description: The reason text that a rejection carries. The field is absent while the
                      status is "pending".
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: The repo request record. This response never hides the actor fields. The
                  caller always sees their own login in requestedBy. The list, get, approve, and reject
                  responses hide requestedBy and approver from a caller who cannot read the audit trail.
        '400':
          description: '`invalid_name`: the name is absent, or it does not match ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$.
            Message "repo name must start with a letter or digit, then letters, digits, ''.'', ''_'' or
            ''-'' (max 100 chars)".

            `invalid_visibility`: visibility is not empty, and it is not "public" or "private". Message
            "visibility must be public or private".

            `invalid_template`: template is not empty and does not match the name pattern. Message "template
            must be an existing org repo name".

            `invalid_description`: description is longer than 350 characters. Message "description must
            be 350 characters or fewer".

            `bad_request`: the body is absent, or it is not valid JSON. Message "invalid json body".

            The service reports only the first failure. The order is body, name, visibility, template,
            then description.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent or malformed. Message "missing
            or malformed Authorization header".

            `unauthenticated`: GitHub refused the token. Message "invalid github token". A different token
            check failure gives the message "could not validate github token".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`user_unauthorized`: the caller is not a member of the repository-create team
            in the Universe organization. Message "caller is not on the required team". The service does
            this check before it reads the body. A caller who is not a member never gets 400 or 413.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The repository feature is off, thus this route does not exist. The body is plain
            text. There is no JSON error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
        '409':
          description: '`already_exists`: another request already claims this repository name. Message
            "a request for this repo name is already pending or active".

            A claim with the status "pending" or "approved" always conflicts.

            For a claim with the status "active" the service asks GitHub if the repository exists.

            If the repository is gone, the service sets the old request to "failed" and answers 201.

            If the repository exists, or the GitHub check fails, the answer stays 409.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`: the body is larger than 64 KiB. Message "request body too large".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub rate limited the token check or the team check. Message
            "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the client canceled the request while the service saved
            it. Message "request canceled by client".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`misconfigured`: the repository-create team is not configured. Message "repo authz
            team not set".

            `internal_error`: the service failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`repo_store_failed`: the service could not save the request. Message "upstream
            call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub is unavailable. The token check gives the message
            "github api unavailable; retry later". The team check gives the message "could not probe team
            membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than 60 seconds. The service sent no response before that
            limit. The body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - repo
      x-feature-gate: When the repository feature is off, this route answers 404 with a plain-text body
        and no JSON error envelope. When the feature is on, the caller must be a member of the repository-create
        team in the Universe organization. A caller who is not a member gets 403 with the code `user_unauthorized`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$
                  description: Required. The name must match ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,99}$. An absent
                    or empty name gives 400 with the code `invalid_name`.
                visibility:
                  type: string
                  enum:
                  - public
                  - private
                  default: private
                  description: Optional. The value must be "public" or "private". An absent or empty value
                    defaults to "private". A different value gives 400 with the code `invalid_visibility`.
                description:
                  type: string
                  maxLength: 350
                  description: Optional. The maximum length is 350 characters. The service counts characters,
                    not bytes. A longer value gives 400 with the code `invalid_description`.
                template:
                  type: string
                  description: Optional. A non-empty template must match the same pattern as the name.
                    A value that does not match gives 400 with the code `invalid_template`. The service
                    does not check that the template exists. A wrong template makes the later approval
                    fail with the outcome "approved_failed".
              description: The body must be a JSON object. The maximum size is 64 KiB. A larger body gives
                413 with the code `too_large`. An absent or malformed body gives 400 with the code `bad_request`.
                The service ignores unknown fields and does not check the Content-Type header.
  /api/repos:
    get:
      operationId: getRepos
      security:
      - githubBearer: []
      responses:
        '200':
          description: The service returns every repo request that matches the `status` and `mine` query
            parameters.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  - owner
                  - visibility
                  - status
                  - requestedBy
                  - createdAt
                  - updatedAt
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    owner:
                      type: string
                    visibility:
                      type: string
                      enum:
                      - public
                      - private
                    description:
                      type: string
                      description: The description text of the requested repository, at most 350 characters.
                        The key is absent when the request carries no description.
                    template:
                      type: string
                      description: The name of the template repository for this request. The key is absent
                        when the request uses no template.
                    status:
                      type: string
                      enum:
                      - pending
                      - approved
                      - active
                      - rejected
                      - failed
                    url:
                      type: string
                      description: The URL of the created GitHub repository. The key is absent until the
                        status becomes "active".
                    error:
                      type: string
                      description: The reason that the request failed. The key is absent unless the status
                        is "failed".
                    requestedBy:
                      type: string
                      description: The GitHub login of the caller who submitted the request. The key is
                        always present. The value is an empty string for a caller who is not a member
                        of the staff audit-read team.
                    approver:
                      type: string
                      description: The GitHub login of the caller who approved or rejected the request.
                        The key is absent for a request that is still pending. The key is also absent
                        for a caller who is not a member of the staff audit-read team.
                    rejectReason:
                      type: string
                      description: The reason text that the approver gave with a rejection. The key is
                        absent when the rejection carried no reason.
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
