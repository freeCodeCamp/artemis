          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - deployId
                properties:
                  url:
                    type: string
                    description: This value is the public production URL of the site.
                  deployId:
                    type: string
                    description: This value is the deploy id that the production alias now holds. It is
                      the deployId you sent, or the id read from the preview alias.
                additionalProperties: false
        '400':
          description: '`bad_request`: the body is not a JSON object, or a field has the wrong type. Message
            "invalid json body". A deployId that is not empty and does not match the pattern also gives
            this code. Message "deployId is not a valid artemis deploy id".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent or malformed. Message "missing
            or malformed Authorization header".

            `unauthenticated`: GitHub refused the token. Message "invalid github token", or "could not
            validate github token" when the check fails for a different reason.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: the site is not registered, or it has no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: you are on none of the authorized teams of the site. Message "user is
            not on any authorized team for this site".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`alias_drift`: expectedCurrent is not empty and does not equal the current production
            alias. The body adds `site` and `current` beside `error`. The field `current` is empty when
            the site has no production alias. The service makes this check before it resolves the deploy
            id and before the index check. Message "production alias has moved since expectedCurrent was
            read".

            `site_reserved`: the site name is held after a delete. The error object adds `reservedUntil`
            as an RFC 3339 time. Message "site name is reserved after a delete; undelete it or wait for
            the reclaim".

            `site_locked`: a different operation holds the site lock. Message "another operation on this
            site is in progress; retry shortly".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/AliasDriftError'
        '410':
          description: '`site_gone`: the site was deleted before the alias write. Message "site was deleted;
            its alias cannot be written".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`: the request body is more than 64 KiB. Message "request body too large".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`no_preview`: you sent no deployId, and the preview alias is absent or empty.
            Message "no preview alias to promote" when the alias is absent, or "preview alias is empty"
            when its value is blank.

            `missing_index`: the target deploy has no root index.html. This check applies to a supplied
            deployId and to the preview alias. Message "target deploy has no root index.html; it cannot
            be served at /".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub rate-limited the token check or the team check. Message
            "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: a storage call or a lock call stopped because the request
            was canceled. Message "request canceled by client".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`internal_error`: the service failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`r2_get_failed`: the read of the production alias for the expectedCurrent guard
            failed, or the read of the preview alias failed. Message "upstream call failed".

            `r2_head_failed`: the check for the root index.html of the target deploy failed. Message "upstream
            call failed".

            `r2_put_failed`: the write of the production alias failed. The alias did not move. Message
            "upstream call failed".

            `pg_write_failed`: the production alias moved, but the record of the new alias failed after
            retries. The promote is live. Message "upstream call failed".

            `registry_read_failed`: the read of the site record failed. Message "upstream call failed".

            `site_lock_failed`: the site lock failed for a reason that is not a timeout. Message "upstream
            call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub is unavailable. Message "github api unavailable;
            retry later" for the token check, or "could not probe team membership" for the team check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The 60 second limit for this route passed before the service wrote a response.
            The body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: site
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: The body is optional. An empty body keeps the legacy behaviour. The service
                then promotes the deploy that the preview alias holds. The body cannot be more than 64
                KiB. Unknown fields are ignored. The service checks your authorization before it reads
                the body.
              properties:
                deployId:
                  type: string
                  description: This field is optional. The service removes leading and trailing spaces.
                    A value that is not empty must match `^\d{8}-\d{6}-[A-Za-z0-9-]{1,64}$`, or the service
                    answers 400 `bad_request`. When you send this field, the service does not read the
                    preview alias. It writes this id to the production alias.
                expectedCurrent:
                  type: string
                  description: This field is an optional guard. The service removes leading and trailing
                    spaces, but it does not check the value against a pattern. When the value is not empty,
                    the current production alias must be equal to it, or the service answers 409 `alias_drift`.
                    A site with no production alias always fails this guard. An empty string skips the
                    guard.
              additionalProperties: true
  /api/site/{site}/rollback:
    post:
      operationId: postSiteRollback
      security:
      - githubBearer: []
      responses:
        '200':
          description: The service moved the production alias to the `to` deploy. The site now serves
            that deploy in production. The service sends this body before it clears the edge cache. The
            purge adds no headers and no data.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - deployId
                properties:
                  url:
                    type: string
                    description: The public production URL of the site. The hostname comes from the service
                      configuration.
                  deployId:
                    type: string
                    description: The `to` value from the request, without leading and trailing spaces.
                      It is now the production deploy id.
                additionalProperties: false
        '400':
          description: '`bad_request`: three conditions give this code. Message "invalid json body" when
            the body is absent, empty, or not valid JSON. Message "to is required" when `to` is absent
            or holds only spaces. Message "to is not a valid artemis deploy id" when `to` does not match
            the deploy id pattern. The service checks your site access before it reads the body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the `Authorization` header is absent or malformed. Message "missing
            or malformed Authorization header".

            `unauthenticated`: GitHub rejected the token. Message "invalid github token". A different
            validation failure gives the same code with message "could not validate github token".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: the site is not registered, or it has no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: you are on no authorized team for this site. Message "user is not on
            any authorized team for this site".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`alias_drift`: `expectedCurrent` is not empty and is different from the live production
            alias. Message "production alias has moved since expectedCurrent was read". The body also
            carries `site` and `current`. `current` is the live production alias, without leading and
            trailing spaces, or "" when no production alias exists. The service makes this check after
            the target checks. Therefore 422 `deploy_missing` and 422 `missing_index` win over this code.

            `site_reserved`: the site name is held after a delete. Message "site name is reserved after
            a delete; undelete it or wait for the reclaim". The error object also carries `reservedUntil`,
            an RFC 3339 time. The service can give this code at the access check or inside the site lock,
            before the target checks.

            `site_locked`: a different operation has exclusive access to the site. Message "another operation
            on this site is in progress; retry shortly". Send the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/AliasDriftError'
        '410':
          description: '`site_gone`: the site is no longer registered. Message "site was deleted; its
            alias cannot be written". The service makes this check inside the site lock, before the target
            checks. Therefore a deleted site cannot get a live alias.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`too_large`: the request body is more than 64 KiB. Message "request body too large".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`deploy_missing`: the target deploy holds no objects in storage. A cleanup job
            can remove an old deploy. Message "target deploy no longer exists in r2".

            `missing_index`: the target deploy has no top-level index.html. Message "target deploy has
            no root index.html; it cannot be served at /". The production alias does not move.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applied a rate limit. Message "github api rate limited;
            retry later". This can occur at the token check or at the team check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: a storage, registry, or lock call reported a cancel.
            Message "request canceled by client". A client that already closed the connection gets no
            body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
        '500':
          description: '`internal_error`: the service failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`registry_read_failed`: the site record read before the alias write failed. Message
            "upstream call failed".

            `r2_list_failed`: the storage probe for the target deploy failed. Message "upstream call failed".

            `r2_head_failed`: the storage probe for the top-level index.html of the target deploy failed.
            Message "upstream call failed".

            `r2_get_failed`: the read of the live production alias for the `expectedCurrent` check failed.
            Message "upstream call failed".

            `r2_put_failed`: the production alias write failed. The previous alias stays live. Message
            "upstream call failed".

            `pg_write_failed`: the alias record write failed after 3 attempts. Message "upstream call
            failed". The new alias is already live. Therefore the site serves the target deploy, but the
            alias record can disagree.

            `site_lock_failed`: the service could not get exclusive access to the site, for a cause other
            than contention. Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub is unavailable at the token check. Message "github
            api unavailable; retry later". The team check gives the same code for any failure other than
            a rate limit. Message "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for the GitHub-token routes. The
            body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: site
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The rollback request. The body is required. The body limit is 64 KiB. The service
                ignores unknown fields. An absent or empty body gives 400 `bad_request` with message "invalid
                json body".
              required:
              - to
              properties:
                to:
                  type: string
                  description: Required. The service removes leading and trailing spaces. An empty value
                    gives 400 `bad_request` with message "to is required". The value must match `^\d{8}-\d{6}-[A-Za-z0-9-]{1,64}$`.
                    A different shape gives 400 `bad_request` with message "to is not a valid artemis
                    deploy id".
                expectedCurrent:
                  type: string
                  description: Optional guard. The service removes leading and trailing spaces, but does
                    not check the shape. When the value is not empty, the live production alias must be
                    equal to it. A different alias gives 409 `alias_drift`. An absent or empty value skips
                    the guard. A production alias that does not exist reads as "".
              additionalProperties: true
  /api/sites:
    get:
      operationId: getSites
      security:
      - githubBearer: []
      responses:
        '200':
          description: The registry read succeeded. The body is a JSON array of site rows, sorted by `slug`
            in ascending order. An empty result gives `[]` and never `null`. The list holds only the sites
            that match the `state` parameter. The service shows `createdBy` only to a member of the audit-read
            team, by default "staff", in the Universe organization. Other callers get an empty `createdBy`.
            The service also hides `createdBy` when it cannot complete the team check.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - slug
                  - teams
                  - createdAt
                  - updatedAt
                  - createdBy
                  - state
                  additionalProperties: false
                  properties:
                    slug:
                      type: string
                    teams:
                      type: array
                      nullable: true
                      items:
                        type: string
                      description: GitHub team slugs that are authorized for the site. The field is always
                        present. The value is `null` when the site row holds no teams.
                    createdAt:
                      type: string
                      description: Time when the site was registered, as an RFC3339 timestamp. The value
                        can carry nanoseconds. The field is always present.
                    updatedAt:
                      type: string
                    createdBy:
                      type: string
                      description: GitHub login of the caller that registered the site. The field is always
                        present. The value is an empty string when the caller must not see actor identity.
                    state:
                      type: string
                      enum:
                      - active
                      - reserved
                      description: State of the site. The value is "active" for a live site, or "reserved"
                        for a name that a delete holds. A row with no stored state gives "active".
                    reservedUntil:
                      type: string
                      description: End of the reservation period, as an RFC3339 timestamp. The field is
                        present only on a reserved row that has an end time.
        '400':
          description: '`invalid_state`: the `state` value is not empty, and it is not "active" or "reserved".
            Message "state must be active or reserved". The service reads the registry before this check.
            A failed read therefore gives 502 `registry_read_failed`, and not 400.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent, or it is not "Bearer <token>"
            with no whitespace in the token. Message "missing or malformed Authorization header".

            `unauthenticated`: GitHub rejected the token. Message "invalid github token", or "could not
            validate github token" when the check fails for another reason.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applied a rate limit to the token check. Message "github
            api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the client closed the connection during the registry
            read. Message "request canceled by client". This status is not standard. When the request
            is already canceled, the service sends no body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`internal_error`: the request failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`registry_read_failed`: the read of the site registry failed. The service does
            not give the cause. Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`upstream_unavailable`: GitHub is unavailable for the token check. Message "github
            api unavailable; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for GitHub bearer routes. The response
            has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - sites
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Filter on the site state. An absent or empty value lists only active sites, as does
          the value "active". The value "reserved" lists only the names that a delete holds. Any other
          value gives 400 `invalid_state`. The service reads the registry before it checks this value.
          A failed read therefore gives 502 `registry_read_failed`, and not 400.
  /api/site/register:
    post:
      operationId: postSiteRegister
