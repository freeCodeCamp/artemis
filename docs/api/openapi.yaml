            api unavailable; retry later". The team check gives the same code with the message "could
            not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for GitHub bearer routes. The response
            has no body. The tombstone and the move do not stop at that limit. They have their own limit
            of 10 minutes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: site
        in: path
        required: true
        schema:
          type: string
      - name: deployId
        in: path
        required: true
        schema:
          type: string
  /api/site/{site}/deploys/{deployId}/restore:
    post:
      operationId: postSiteDeploysRestore
      security:
      - githubBearer: []
      responses:
        '200':
          description: The deploy is live again. The body gives `site`, `deployId`, `status` "restored",
            `moved`, and `bytes`. A second call for a deploy that is already live gives the same body,
            with `moved` 0.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - site
                - deployId
                - status
                - moved
                - bytes
                properties:
                  site:
                    type: string
                  deployId:
                    type: string
                  status:
                    type: string
                    enum:
                    - restored
                  moved:
                    type: integer
                    description: The number of objects that moved from the trash back to the live deploy.
                      The value is 0 when the deploy was already live.
                  bytes:
                    type: integer
                    description: The total size in bytes of the live deploy after the move. The value
                      is 0 when the service cannot measure the size.
                additionalProperties: false
        '400':
          description: '`bad_request`: `deployId` does not match the pattern `^\d{8}-\d{6}-[A-Za-z0-9-]{1,64}$`.
            Message "deployId is not a valid artemis deploy id". The service does the site authorization
            checks first. A caller without access gets 401 or 403 for a bad id.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the `Authorization` header is absent or malformed. Message "missing
            or malformed Authorization header".

            `unauthenticated`: GitHub does not accept the token, or the service cannot complete the check.
            Message "invalid github token" or "could not validate github token".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: the site is not registered, or it has no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: the caller is not a member of an authorized team for this site. Message
            "user is not on any authorized team for this site".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_reserved`: the site name is held after a delete. Message "site name is reserved
            after a delete; undelete it or wait for the reclaim". The error object also carries `reservedUntil`,
            an RFC 3339 time. No objects move.

            `site_locked`: a different operation has exclusive access to the site. Message "another operation
            on this site is in progress; retry shortly". Send the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: '`already_purged`: no objects moved out of the trash, and the deploy is not live.
            Message "no bytes to restore; the deploy was already hard-purged". The objects are gone from
            the trash and from the live deploy.

            `site_gone`: the site is no longer registered. Message "site was deleted; deploy cannot be
            restored". The service makes this check immediately before the move.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applies a rate limit to the token check or the team check.
            Message "github api rate limited; retry later". Wait, then send the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the service loses exclusive access to the site while
            the restore runs. Message "request canceled by client". The restore can be incomplete. Send
            the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
        '500':
          description: '`internal_error`: the service failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`r2_move_failed`: the move of the deploy objects out of the trash failed. Message
            "upstream call failed".

            `r2_has_prefix_failed`: no objects moved, and the check for a live deploy failed. Message
            "upstream call failed".

            `restore_failed`: the update of the trash record after the move failed. Message "upstream
            call failed".

            `registry_read_failed`: the read of the site record before the move failed. Message "upstream
            call failed".

            `site_lock_failed`: the service could not get exclusive access to the site, for a cause other
            than contention. Message "upstream call failed".

            The restore has a time limit of 10 minutes. A step that passes this limit gives one of these
            codes.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`unavailable`: the service has no trash store. Message "trash store not configured".
            The service makes this check after the authorization checks and after the `deployId` check.

            `upstream_unavailable`: GitHub does not answer the token check or the team check. Message
            "github api unavailable; retry later" or "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for the GitHub-token routes. The
            body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: site
        in: path
        required: true
        schema:
          type: string
      - name: deployId
        in: path
        required: true
        schema:
          type: string
  /api/site/{site}/trash:
    get:
      operationId: getSiteTrash
      security:
      - githubBearer: []
      responses:
        '200':
          description: The service returns the trashed deploys of the site.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: array
                description: One item for each trashed deploy of the site. The service sorts the items
                  by trashedAt, newest first. An empty trash gives [], not null.
                items:
                  type: object
                  required:
                  - deployId
                  - trashedAt
                  - expiresAt
                  - bytes
                  properties:
                    deployId:
                      type: string
                      description: The identifier of the trashed deploy.
                    trashedAt:
                      type: string
                      format: date-time
                      description: The time when the deploy moved to trash. The format is RFC 3339 in
                        UTC, for example 2026-04-20T14:15:22Z.
                    expiresAt:
                      type: string
                      format: date-time
                      description: The end of the recovery window of the trashed deploy. The value is
                        trashedAt plus the recovery window. The default window is 168 hours. The format
                        is RFC 3339 in UTC.
                    bytes:
                      type: integer
                      description: The size of the trashed deploy in bytes. The value is 0 if the service
                        could not measure the size.
                  additionalProperties: false
        '401':
          description: '`missing_bearer`: The Authorization header is absent or malformed. Message "missing
            or malformed Authorization header".

            `unauthenticated`: GitHub refused the bearer token. Message "invalid github token" or "could
            not validate github token".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: The site is not registered, or it has no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: The caller is on no authorized team of the site. Message "user is not
            on any authorized team for this site".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_reserved`: The service holds the site name after a delete. Message "site
            name is reserved after a delete; undelete it or wait for the reclaim". The error object also
            carries reservedUntil, an RFC 3339 UTC time.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - reservedUntil
                    properties:
                      code:
                        enum:
                        - site_reserved
                        type: string
                      message:
                        type: string
                      reservedUntil:
                        type: string
                        format: date-time
        '429':
          description: '`rate_limited`: GitHub rate limited the token check or the team check. Message
            "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: The client canceled the request during the trash read.
            Message "request canceled by client". The service sends no body if the connection is already
            closed.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
        '500':
          description: '`internal_error`: The request failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`pg_read_failed`: The trash read failed. Message "upstream call failed". The message
            gives no more detail.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`unavailable`: The trash store is not configured. Message "trash store not configured".
            The service makes this check after the site authorization check.

            `upstream_unavailable`: GitHub was unavailable for the token check or the team check. Message
            "github api unavailable; retry later" or "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request did not finish in the 60 second limit of this route. The response has
            no JSON body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: site
        in: path
        required: true
        schema:
          type: string
  /api/site/{site}/alias/{mode}:
    get:
      operationId: getSiteAlias
      security:
      - githubBearer: []
      responses:
        '200':
          description: The site has an alias for this mode, and the alias names a deploy. The body carries
            `site`, `mode`, `deployId` and `url`.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - site
                - mode
                - deployId
                - url
                properties:
                  site:
                    type: string
                    description: The site name from the path, echoed without change.
                  mode:
                    type: string
                    enum:
                    - preview
                    - production
                    description: The mode from the path, in lower case and without surrounding whitespace.
                      The value is "preview" or "production".
                  deployId:
                    type: string
                    description: The deploy identifier that the alias names, without surrounding whitespace.
                  url:
                    type: string
                    description: The public URL that serves this site in this mode. Preview mode and production
                      mode use separate URL formats, which come from the service configuration.
                additionalProperties: false
        '400':
          description: '`bad_request`: the `mode` path parameter is not "preview" or "production". Message
            "mode must be preview or production". The service removes surrounding whitespace and puts
            the value in lower case before this check. The service does this check before the site check
            and the team check. A bad mode on an unregistered site thus gives 400 and not 403.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the Authorization header is absent, or it is not "Bearer <token>"
            with no whitespace in the token. Message "missing or malformed Authorization header".

            `unauthenticated`: GitHub rejected the token. Message "invalid github token", or "could not
            validate github token" when the check fails for another reason.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`site_unauthorized`: the site is not registered, or it has no authorized teams.
            Message "site is not registered or has no authorized teams".

            `user_unauthorized`: the caller is not a member of an authorized team of the site. Message
            "user is not on any authorized team for this site".

            The service checks the site before it checks the team membership.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`no_alias`: the site has no alias for this mode. Message "alias has not been set
            for this site/mode". When the alias exists but its body is empty or only whitespace, the code
            is the same. The message is then "alias body is empty".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_reserved`: a delete put the site name in a reservation period. Message "site
            name is reserved after a delete; undelete it or wait for the reclaim". The error object also
            carries `reservedUntil`, an RFC3339 timestamp in UTC.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - reservedUntil
                    properties:
                      code:
                        enum:
                        - site_reserved
                        type: string
                      message:
                        type: string
                      reservedUntil:
                        type: string
                        format: date-time
        '429':
          description: '`rate_limited`: GitHub applied a rate limit to the token check or to the team
            check. Message "github api rate limited; retry later".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the client closed the connection during the alias read.
            Message "request canceled by client". This status is not standard. When the request is already
            canceled, the service sends no body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
        '500':
          description: '`internal_error`: the request failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`r2_get_failed`: the read of the alias from object storage failed. The service
