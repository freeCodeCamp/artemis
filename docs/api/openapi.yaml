  "/api/sites":
    get:
      operationId: getSites
      security:
      - githubBearer: []
      responses:
        '200':
          description: 'Registry read succeeded. Always a JSON array, never null:
            rows is make([]SiteRow,0,...) at. createdBy is blanked for every row unless
            h.AuditReadAuthzTeam is set, h.RepoGH is non-nil, and the RepoGH team
            probe returns ok with no error — a probe error fails closed to redaction.'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - slug
                  - teams
                  - createdAt
                  - updatedAt
                  - createdBy
                  - state
                  additionalProperties: false
                  properties:
                    slug:
                      type: string
                    teams:
                      type: array
                      nullable: true
                      items:
                        type: string
                      description: copied straight from registry.Site.Teams with no
                        nil-guard, so a nil slice encodes as null
                    createdAt:
                      type: string
                      description: Go time.Time default marshal = RFC3339 with nanoseconds
                        when present
                    updatedAt:
                      type: string
                    createdBy:
                      type: string
                      description: forced to "" (present, not omitted) when callerSeesActors
                        is false; no omitempty tag
                    state:
                      type: string
                      enum:
                      - active
                      - reserved
                      description: empty State from the store defaults to "active",
                    reservedUntil:
                      type: string
                      description: omitempty; set only when s.IsReserved && !s.ReservedUntil.IsZero,
        '400':
          description: '`invalid_state`: ?state is a non-empty value other than "active"
            or "reserved".'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: |-
            `missing_bearer`: No/malformed "Authorization: Bearer <tok>" header.
            `unauthenticated`: GH ValidateToken rejected the token, or failed for a reason that is neither rate-limit nor unavailable.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: "`rate_limited`: GitHub API rate-limited the token validation."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: "`client_closed_request`: h.Registry.Sites returned an error
            wrapping context.Canceled AND r.Context.Err==nil. When the request context
            is itself already done, no bytes are written and only the access-log status
            is set to 499."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: "`internal_error`: Handler panicked; Recoverer converts it."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: '`registry_read_failed`: h.Registry.Sites returned a non-context.Canceled
            error. Message is the opaque "upstream call failed" from writeUpstreamError.'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: "`upstream_unavailable`: GitHub API unavailable during token
            validation."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      tags:
      - sites
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: 'Absent or empty string = list active sites only. Accepted values
