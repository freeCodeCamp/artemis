            body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
  /api/site/{slug}/release:
    post:
      operationId: postSiteRelease
      security:
      - githubBearer: []
      responses:
        '200':
          description: The service freed the reserved name and reclaimed its stored objects. The name
            must be in the reserved state that a delete creates. The service stopped the undelete path
            first. Then it recorded a whole-site tombstone, when this deployment keeps a tombstone store.
            Then it moved every object of the site to the trash area. Last, it freed the name. The body
            carries `slug`, `status` with the value "released", and `moved`. After this, the undelete
            operation gives 404, and the register operation can take the name. A client that closes the
            connection does not stop this work.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                type: object
                required:
                - slug
                - status
                - moved
                additionalProperties: false
                properties:
                  slug:
                    type: string
                  status:
                    enum:
                    - released
                    type: string
                  moved:
                    type: integer
                    description: Count of stored objects that the service moved from the location of the
                      site to the trash area. The value is 0 when the site holds no objects.
        '400':
          description: '`invalid_slug`: the `{slug}` path parameter does not match `^[a-z][a-z0-9-]{0,62}$`.
            Message "slug must be 1-63 chars, lowercase letter first, then [a-z0-9-]". The service checks
            your team membership before this check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`missing_bearer`: the `Authorization` header is absent or malformed. Message "missing
            or malformed Authorization header".

            `unauthenticated`: GitHub rejected the token. Message "invalid github token". A different
            validation failure gives the same code with the message "could not validate github token".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`user_unauthorized`: you are not a member of the repository-approve team in the
            Universe organization. Message "caller is not on the required team". This team is not the
            team that administers the site registry. Membership of the registry team alone is not sufficient,
            because a release cannot be undone. The service makes this check first. Therefore a caller
            who is not a member never gets 400 or 404.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`not_found`: the name holds no reservation. Message "site is not a reserved name".
            An active site and an unknown slug both give this code, and nothing changes. The service gives
            the same code and message when the reservation is already gone at the last step. In that case
            the objects are in the trash area.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`site_locked`: a different operation has exclusive access to the site. Message
            "another operation on this site is in progress; retry shortly". An undelete of the same name
            takes the same access. Send the request again.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: GitHub applied a rate limit. Message "github api rate limited;
            retry later". This can occur at the token check or at the team check.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: a storage call, a database call, or a lock call reported
            a canceled operation. Message "request canceled by client". A client disconnect alone does
            not give this status, because the reclaim continues to its end. When the request is already
            canceled, the service sends no body.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`misconfigured`: this deployment names no team for repository approval. Message
            "repo authz team not set".

            `internal_error`: the service failed unexpectedly. Message "internal server error".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: '`registry_read_failed`: the read of the state of the site failed. Message "upstream
            call failed". Nothing changes.

            `registry_write_failed`: the service could not stop the undelete path, or it could not free
            the name at the last step. Message "upstream call failed". The first failure moves no object.
            The second failure leaves the objects in the trash area and the name reserved.

            `tombstone_record_failed`: the service could not record the whole-site tombstone. Message
            "upstream call failed". No object moves, but the undelete path is already stopped. Send the
            request again.

            `r2_move_failed`: the move of the objects of the site to the trash area failed. Message "upstream
            call failed". The name stays reserved, therefore you can send the request again. The undelete
            path is already stopped, and some objects can be in the trash area.

            `site_lock_failed`: the service could not get exclusive access to the site, for a cause other
            than contention. Message "upstream call failed".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: '`unavailable`: this deployment keeps no reservations, therefore it cannot release
            a name. Message "reservation store not configured". The service checks the slug before this
            check.

            `upstream_unavailable`: GitHub is unavailable at the token check. Message "github api unavailable;
            retry later". The team check gives the same code for any failure other than a rate limit.
            Message "could not probe team membership".'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The request ran longer than the 60 second limit for GitHub bearer routes. The response
            has no body. The reclaim does not stop at that limit. It has its own limit of 10 minutes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
      tags:
      - site
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    githubBearer:
      type: http
      scheme: bearer
      description: 'Send a GitHub token in the `Authorization: Bearer <token>` header. `Bearer` must have
        this exact case, and exactly one space follows it. The token must not be empty. The token must
        not contain a space, tab, carriage return, or line feed. Your GitHub team membership decides which
        sites you can reach.

        `missing_bearer`: 401 when the header is absent or malformed. Message "missing or malformed Authorization
        header".

        `unauthenticated`: 401 when GitHub refuses the token. Message "invalid github token", or "could
        not validate github token" when the check fails for a different reason.

        `rate_limited`: 429 when GitHub rate limits the check. Message "github api rate limited; retry
        later".

        `upstream_unavailable`: 503 when GitHub is unavailable. Message "github api unavailable; retry
        later".'
    deployJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'POST /api/deploy/init returns this token in the `jwt` field. The same response gives
        the expiry in `expiresAt`, as UTC to the second, for example `2026-09-03T14:05:00Z`. The token
        is bound to one caller, one site, and one deploy id. Send it in the `Authorization: Bearer <token>`
        header on the upload and finalize routes. The header format rules of the GitHub token apply here
        too.

        `missing_bearer`: 401 when the header is absent or malformed. Message "missing or malformed Authorization
        header".

        `jwt_expired`: 401 when the token is past its expiry. Message "deploy-session jwt expired".

        `jwt_invalid`: 403 when the token does not verify. Message "invalid deploy-session jwt".

        `jwt_wrong_deploy`: 403 when the `deployId` path parameter differs from the deploy id in the token.
        Message "deploy-session jwt does not match url deploy id".'
  headers:
    X-Request-ID:
      description: The id of this request. When the request carries an `X-Request-ID` header, the service
        sends the same value back. The service does not validate or shorten that value, so you can use
        your own correlation id. If the header is absent, the service makes an id of 24 hexadecimal characters.
        Give this id when you report a problem.
      schema:
        type: string
    X-Artemis-Version:
      description: The version of the service build that answered this request.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
          additionalProperties: true
          description: 'Some codes add more fields in this object.

            `missing`: array of strings on 422 `verify_failed`. It lists the paths from the `files` list
            that were not uploaded.

            `reservedUntil`: RFC 3339 time on 409 `site_reserved`. The 409 from POST /api/site/register
            carries no such field.

            `hint`: string on 422 `missing_index` from POST /api/deploy/{deployId}/finalize. The field
            appears only when the file list looks like a framework build directory. The text lists static-export
            options for common frameworks. It also asks you to point `build.output` in `platform.yaml`
            at the export directory.'
    AliasDriftError:
      type: object
      required:
      - error
      - site
      - current
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - alias_drift
            message:
              type: string
        site:
          type: string
        current:
          type: string
          description: The deploy id that the production alias holds now. The value is empty when the
            site has no production alias. Send this value as `expectedCurrent` to retry.
      description: The 409 `alias_drift` body of POST /api/site/{site}/promote and POST /api/site/{site}/rollback.
        The service sends it when `expectedCurrent` is not empty and differs from the current production
        alias. The body carries `site` and `current` beside `error`. Message "production alias has moved
        since expectedCurrent was read". The alias does not change.
