            application/json:
              schema:
                type: object
                required:
                - outcome
                - request
                additionalProperties: false
                properties:
                  outcome:
                    type: string
                    enum:
                    - ok
                    - approved_failed
                    description: ok = repo created, request.status active; approved_failed
                      = approval recorded but GitHub creation failed, request.status
                      failed
                  request:
                    type: object
                    required:
                    - id
                    - name
                    - owner
                    - visibility
                    - status
                    - requestedBy
                    - createdAt
                    - updatedAt
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      owner:
                        type: string
                      visibility:
                        type: string
                        enum:
                        - public
                        - private
                      description:
                        type: string
                        description: omitempty
                      template:
                        type: string
                        description: omitempty
                      status:
                        type: string
                        enum:
                        - pending
                        - approved
                        - active
                        - rejected
                        - failed
                        description: active on outcome ok, failed on outcome approved_failed
                      url:
                        type: string
                        description: omitempty; the created repo URL, present on outcome
                          ok
                      error:
                        type: string
                        description: omitempty; present on approved_failed. Verbatim
                          githubapp.UserFacingError/RepoExistsError text when curated,
                          otherwise the sanitized literal "repository creation failed"
                          — raw transport errors never reach the client
                      requestedBy:
                        type: string
                        description: NOT omitempty — always present, blanked to ""
                          when the approver is not on AuditReadAuthzTeam
                      approver:
                        type: string
                        description: omitempty — absent when redacted
                      rejectReason:
                        type: string
                        description: omitempty
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                description: RepoApproveResponse,. Both the ok and the approved_failed
                  paths are 200 — a GitHub creation failure is a recorded outcome,
                  not an HTTP error. Request is built by h.repoRowFor, so actor fields
                  ARE redacted for an approver who is not also on AuditReadAuthzTeam.
        '401':
          description: |-
            `missing_bearer`: Authorization header absent/malformed
            `unauthenticated`: GH.ValidateToken rejected the token
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: '`user_unauthorized`: caller is not on RepoApproveAuthzTeam
            in the Universe org. Being on "staff" is not enough.'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: |-
            `not_found`: h.Repos.Approve returned reporequest.ErrNotFound
            feature disabled, route unmounted
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: "`already_resolved`: the CAS pending->approved was rejected
