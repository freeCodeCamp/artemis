    post:
      operationId: postRepoApprove
      security:
      - githubBearer: []
      responses:
        '200':
          description: outcome ok or outcome approved_failed. Also covers the stranded-approved
            resume, where a prior attempt created the repo and a retry reconciles
            to ok instead of 409.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
