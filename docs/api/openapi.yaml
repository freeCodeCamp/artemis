          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Artemis-Version:
              $ref: '#/components/headers/X-Artemis-Version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '499':
          description: '`client_closed_request`: the registry write was canceled before it completed.
