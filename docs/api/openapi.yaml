              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      tags:
      - site
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
  "/api/site/{slug}/release":
    post:
      operationId: postSiteRelease
      security:
      - githubBearer: []
      responses:
        '200':
          description: The row was reserved, ExpireReservation disarmed undelete,
            the whole-site tombstone landed (when h.Tombstones != nil), the prefix
            moved into trash, and ReleaseReservationNow freed the name — in that order.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                type: object
                required:
                - slug
                - status
                - moved
                additionalProperties: false
                properties:
                  slug:
                    type: string
                  status:
                    enum:
                    - released
                  moved:
                    type: integer
                    description: object count returned by R2.MovePrefix(<dirname>/
                      -> <TrashPrefixBase><dirname>/),
        '400':
          description: "`invalid_slug`: {slug} fails slugRe."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: |-
            `missing_bearer`: No/malformed Authorization header; pinned for this route by.
            `unauthenticated`: Token rejected.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: '`user_unauthorized`: Caller is not on h.RepoApproveAuthzTeam.
            Probed with h.RepoGH — the Universe-org GitHub client, NOT h.GH used by
            the register/update/delete routes. message: "caller is not on the required
            team".'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: '`not_found`: Two paths, same code and message ("site is not
            a reserved name"): the slug is active or absent, i.e. requireWritableSite
            did not return registry.ErrReserved; or ReleaseReservationNow returned
            registry.ErrNotFound after the bytes already moved.'
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: "`site_locked`: Site advisory lock timed out — same lock SiteUndelete
            takes."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: "`rate_limited`: The RepoGH team probe was rate-limited, or
            token validation was."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '499':
          description: "`client_closed_request`: A registry/R2 error wrapping context.Canceled
            with r.Context.Err==nil. Note the handler runs on a detached 10-minute
            context."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          description: |-
            `misconfigured`: h.RepoApproveAuthzTeam is "". message: "repo authz team not set".
            `internal_error`: Panic recovered.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: |-
            `registry_read_failed`: requireWritableSite failed with an error that is neither ErrReserved nor ErrNotFound.
            `registry_write_failed`: ExpireReservation failed or ReleaseReservationNow failed non-ErrNotFound.
            `tombstone_record_failed`: h.Tombstones is non-nil and RecordSiteTombstone failed. No bytes have moved at that point.
            `r2_move_failed`: MovePrefix into <TrashPrefixBase, default "_trash/">/<dirname>/ failed. The name stays reserved but undelete is already disarmed.
            `site_lock_failed`: Site lock failed for a non-timeout reason.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: |-
            `unavailable`: h.NameReleaser is nil. message: "reservation store not configured".
            `upstream_unavailable`: The RepoGH team probe failed for a non-rate-limit reason, or GitHub was unavailable at token validation.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/X-Request-ID"
            X-Artemis-Version:
              "$ref": "#/components/headers/X-Artemis-Version"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      tags:
      - site
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    githubBearer:
      type: http
      scheme: bearer
      description: A GitHub token; identity is GitHub team membership.
    deployJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A deploy-session JWT minted by POST /api/deploy/init, scoped to
        one deployId.
  headers:
    X-Request-ID:
      description: Per-request id; echoes the inbound header when present.
      schema:
        type: string
    X-Artemis-Version:
      description: The build version of the server that answered.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
          additionalProperties: true
          description: 'Some codes add sibling fields: `missing` (array of strings)
            on 422 missing files, `reservedUntil` (string) on 409 site_reserved, `hint`
            (string) on 422 missing_index.'
